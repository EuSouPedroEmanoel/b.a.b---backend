services:
  float-tasks-db:
    image: postgres:latest
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: dev-database
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  float-tasks:
    image: float-tasks
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - float-tasks-db
    entrypoint: ./entrypoint.sh
    environment:
      DATABASE_URL: "postgresql+psycopg://root:dev123@float-tasks-db:5432/dev-database"
      GOOGLE_BOOKS_API_KEY: "${GOOGLE_BOOKS_API_KEY:?GOOGLE_BOOKS_API_KEY must be configured}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be configured}"
      CPF_HMAC_SECRET: "${CPF_HMAC_SECRET:?CPF_HMAC_SECRET must be configured}"
      ALGORITHM: "${ALGORITHM:-HS256}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-240}"
      SEED_DEV: "1"


  adminer:
    image: adminer:latest
    container_name: adminer-web
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - float-tasks-db

volumes:
  pgdata:
