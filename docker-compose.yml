services:
  base-acesso-bibliotecario-db:
    image: postgres:18-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-root}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-dev123}"
      POSTGRES_DB: "${POSTGRES_DB:-dev-database}"
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  base-acesso-bibliotecario:
    image: base-acesso-bibliotecario
    build: .
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      - base-acesso-bibliotecario-db
    entrypoint: ./entrypoint.sh
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-dev123}@base-acesso-bibliotecario-db:5432/${POSTGRES_DB:-dev-database}"
      GOOGLE_BOOKS_API_KEY: "${GOOGLE_BOOKS_API_KEY:?GOOGLE_BOOKS_API_KEY must be configured}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be configured}"
      CPF_HMAC_SECRET: "${CPF_HMAC_SECRET:?CPF_HMAC_SECRET must be configured}"
      ACTIVATION_HMAC_SECRET: "${ACTIVATION_HMAC_SECRET:?ACTIVATION_HMAC_SECRET must be configured}"
      ALGORITHM: "${ALGORITHM:-HS256}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-240}"
      ENVIRONMENT: development
      PUBLIC_WEB_URL: "${PUBLIC_WEB_URL:-http://localhost:5173}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      WAIT_FOR_DATABASE_HOST: base-acesso-bibliotecario-db
      UVICORN_RELOAD: "1"
      SEED_DEV: "${SEED_DEV:-0}"


  adminer:
    image: adminer:latest
    container_name: adminer-web
    restart: always
    ports:
      - "${ADMINER_BIND_ADDRESS:-127.0.0.1}:${ADMINER_PORT:-8080}:8080"
    depends_on:
      - base-acesso-bibliotecario-db

volumes:
  pgdata:
