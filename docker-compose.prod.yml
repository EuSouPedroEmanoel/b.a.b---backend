services:
  base-acesso-bibliotecario:
    image: base-acesso-bibliotecario:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    entrypoint: ./entrypoint.sh
    environment:
      ENVIRONMENT: production
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be configured}"
      GOOGLE_BOOKS_API_KEY: "${GOOGLE_BOOKS_API_KEY:?GOOGLE_BOOKS_API_KEY must be configured}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be configured}"
      CPF_HMAC_SECRET: "${CPF_HMAC_SECRET:?CPF_HMAC_SECRET must be configured}"
      ACTIVATION_HMAC_SECRET: "${ACTIVATION_HMAC_SECRET:?ACTIVATION_HMAC_SECRET must be configured}"
      ALGORITHM: "${ALGORITHM:-HS256}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-240}"
      PUBLIC_WEB_URL: "${PUBLIC_WEB_URL:?PUBLIC_WEB_URL must be configured}"
      CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS must be configured}"
      SUPER_ADMIN_USERNAME: "${SUPER_ADMIN_USERNAME:?SUPER_ADMIN_USERNAME must be configured}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD must be configured}"
      SEED_DEV: "0"
      SEED_SUPER_ADMIN: "0"
      UVICORN_WORKERS: "${UVICORN_WORKERS:-2}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
