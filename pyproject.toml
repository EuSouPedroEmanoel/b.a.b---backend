[project]
name = "bibliotec_ginasio"
version = "0.1.1"
description = ""
authors = [
    {name = "Pedro Emanoel", email = "pedroemanoeldasilvadeoliveira@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14, <3.15"
dependencies = [
    "fastapi[standard] (>=0.137.1,<0.138.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "sqlalchemy[asyncio] (>=2.0.51,<3.0.0)",
    "sqlalchemy-stubs (>=0.4,<0.5)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "pyjwt (==2.13.0)",
    "asyncio (==4.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "slowapi (>=0.1.10,<0.2.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.17,<0.16.0)",
    "pytest (>=9.1.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "harlequin (>=2.5.2,<3.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "freezegun (>=1.5.5,<2.0.0)",
    "testcontainers (>=4.15.0,<5.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations', 'src/settings.py', 'src/seeds']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.lint.per-file-ignores]
'tests/*.py' = ['PLR2004', 'PLR0913', 'PLR0915', 'PLR0917', 'PLC0415', 'PT', 'E501']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.coverage.run]
omit = ['src/seeds/*', 'src/seeds']
source = ['src']

[tool.pytest.ini_options]
pythonpath = '.'
addopts = '-p no:warnings'
asyncio_default_fixture_loop_scope = 'function'



[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'uvicorn src.app:app --reload'
pre_test = 'task lint'
test = 'pytest -x --cov=src --cov-report=term-missing --cov-fail-under=95 --cov-config=pyproject.toml'
post_test = 'coverage html'

[tool.poetry]
package-mode = false